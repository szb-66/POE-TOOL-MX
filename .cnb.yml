$:
  tag_push:
    - stages:
        - name: Download and validate GitHub Release assets
          script: |
            set -eu
            tag="$CNB_BRANCH"
            printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            version="${tag#v}"
            installer="PoE-CN-Helper-${version}-win-x64-setup.exe"
            base_url="https://github.com/szb-66/POE-TOOL-MX/releases/download/${tag}"
            mkdir -p release-assets
            for asset in \
              "$installer" \
              "$installer.blockmap" \
              latest.yml \
              SHA256SUMS.txt \
              THIRD_PARTY_NOTICES.md
            do
              curl --fail --location --retry 3 --retry-all-errors \
                --output "release-assets/$asset" "$base_url/$asset"
            done
            cd release-assets
            tr -d '\r' < latest.yml | grep -Fqx "version: $version"
            grep -Fq "$installer" latest.yml
            sha256sum --check --strict SHA256SUMS.txt

        - name: Create CNB Release
          type: git:release
          options:
            title: "流放助手 ${CNB_BRANCH}"
            description: "GitHub Release 国内同步镜像"
            latest: false

        - name: Upload CNB Release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./release-assets/*"

        - name: Mark CNB Release as latest
          type: git:release
          options:
            overlying: true
            title: "流放助手 ${CNB_BRANCH}"
            description: "GitHub Release 国内同步镜像"
            latest: true
