name: Sync published release to CNB

on:
  push:
    tags:
      - 'cnb-sync/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:SOURCE_REF -replace '^cnb-sync/', '' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify published release and sync tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          if ([string]::IsNullOrWhiteSpace($env:CNB_TOKEN)) { throw 'CNB_TOKEN is missing' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
          $release = gh release view $env:RELEASE_TAG --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft) { throw 'Release is not published' }
          foreach ($name in @("PoE-CN-Helper-$version-win-x64-setup.exe", "PoE-CN-Helper-$version-win-x64-setup.exe.blockmap", 'latest.yml', 'SHA256SUMS.txt', 'THIRD_PARTY_NOTICES.md')) {
            if (-not ($release.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' -and $_.size -gt 0 })) { throw "Missing asset: $name" }
          }
          $basicCredential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("cnb:$env:CNB_TOKEN"))
          Write-Output "::add-mask::$basicCredential"
          $auth = "http.extraHeader=Authorization: Basic $basicCredential"
          $remote = 'https://cnb.cool/Auto-Tool-MX/POE-TOOL-MX'
          git -c $auth push $remote "HEAD:refs/heads/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Branch sync failed' }
          git -c $auth push $remote "refs/tags/$env:RELEASE_TAG`:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Tag sync failed' }
