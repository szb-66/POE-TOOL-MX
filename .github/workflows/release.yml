name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag and package versions
        run: npm run release:check

      - name: Prepare and verify embedded Python
        run: |
          npm run runtime:prepare
          npm run runtime:verify

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Smoke-test packaged application
        run: npm run release:smoke

      - name: Generate SHA-256 checksums
        run: npm run release:checksum

      - name: Resolve release assets
        id: assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "dist-electron/PoE-CN-Helper-$version-win-x64-setup.exe"
          $blockmap = "$installer.blockmap"
          $updateMetadata = "dist-electron/latest.yml"
          foreach ($asset in @($installer, $blockmap, $updateMetadata)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }
          $metadata = Get-Content -Raw -LiteralPath $updateMetadata
          $versionPattern = '(?m)^version:\s+' + [regex]::Escape($version) + '\r?$'
          if ($metadata -notmatch $versionPattern) {
            throw "latest.yml version does not match package version"
          }
          if ($metadata -notmatch "PoE-CN-Helper-$([regex]::Escape($version))-win-x64-setup.exe") {
            throw "latest.yml does not reference the release installer"
          }
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "blockmap=$blockmap" >> $env:GITHUB_OUTPUT
          "update_metadata=$updateMetadata" >> $env:GITHUB_OUTPUT

      - name: Generate build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ steps.assets.outputs.installer }}
            dist-electron/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $notesFile = "docs/release-notes/v$version.md"
          $notesArgs = @("--generate-notes")
          if (Test-Path -LiteralPath $notesFile) {
            $notesArgs = @("--notes-file", $notesFile)
          }
          gh release create "${{ github.ref_name }}" `
            "${{ steps.assets.outputs.installer }}" `
            "${{ steps.assets.outputs.blockmap }}" `
            "${{ steps.assets.outputs.update_metadata }}" `
            "dist-electron/SHA256SUMS.txt" `
            "THIRD_PARTY_NOTICES.md" `
            --verify-tag `
            --title "流放助手 ${{ github.ref_name }}" `
            @notesArgs
