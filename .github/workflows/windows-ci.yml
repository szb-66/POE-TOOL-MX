name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare embedded Python
        run: npm run runtime:prepare

      - name: Verify embedded Python
        run: npm run runtime:verify

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build unpacked Windows application
        run: npx electron-builder --win dir --x64

      - name: Smoke-test packaged application
        run: npm run release:smoke
